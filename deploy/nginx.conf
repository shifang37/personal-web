# ============================================================
# shifang37.com 的 Nginx 站点配置
#
# 放置位置：
#   Ubuntu / Debian  → /etc/nginx/sites-available/shifang37.com
#                      然后 ln -s 到 sites-enabled/
#   Alibaba Cloud Linux / CentOS → /etc/nginx/conf.d/shifang37.com.conf
#
# 生效前先跑：nginx -t && systemctl reload nginx
# HTTPS 部分由 certbot --nginx 自动改写，不用手填证书路径。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name shifang37.com www.shifang37.com;

    # 网站根目录（上传脚本默认也放这里）
    root /var/www/shifang37.com;
    index index.html;

    # 访问日志方便排查
    access_log /var/log/nginx/shifang37.access.log;
    error_log  /var/log/nginx/shifang37.error.log;

    charset utf-8;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 静态资源长缓存 ----------
    # 文件名带 hash 的话可以放心 immutable；这里是固定文件名，
    # 所以用 30 天而不是 1 年，改完样式记得让用户强刷。
    location ~* \.(css|js|mjs|svg|png|jpe?g|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 路由 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 不让别人直接访问以 . 开头的隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 404 页面（没有的话自动回退到首页）
    error_page 404 /index.html;
}
